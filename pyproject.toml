[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egohand-twin"
version = "0.1.0"
description = "Offline, reliability-aware 3D hand landmark replay for factory POV videos"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe>=0.10.30,<0.11",
  "opencv-contrib-python>=4.10,<6",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "psutil>=6,<8",
  "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
viewer = ["rerun-sdk>=0.23,<0.30"]
dev = ["pytest>=8,<10"]

[project.scripts]
egohand = "egohand_twin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

